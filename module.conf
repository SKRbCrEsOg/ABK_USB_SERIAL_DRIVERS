ABK_MODULE_ID="usb_serial_drivers"
ABK_MODULE_NAME="USB Serial Drivers (common + ST-Link)"
ABK_MODULE_VERSION="1.1.0"
ABK_MODULE_DESCRIPTION="Enable common USB-to-serial drivers (FTDI, PL2303, CP210x, CH341, CH343, Option, Qualcomm, TI and CDC-ACM/ST-Link) as loadable modules while keeping the usbserial core built-in. Bundles and injects the WCH CH343 driver, which is missing from AOSP GKI."
ABK_MODULE_SUPPORTED_STAGES="after_patch"
ABK_MODULE_DEFAULT_STAGE="after_patch"
ABK_MODULE_RECOMMENDED_STAGES="after_patch"
ABK_MODULE_REPO_URL="https://github.com/SKRbCrEsOg/ABK_USB_SERIAL_DRIVERS"
